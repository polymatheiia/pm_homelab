# /etc/smartd.conf — monitors only the HDD (the SSDs aren't covered; add lines if wanted).
# -a          health, attributes, error and self-test logs
# -o on -S on automatic offline data collection + attribute autosave
# -s ...      short self-test daily 03:00, long self-test Sundays 04:00 (~77 min)
# -W 4,45,55  log temp jumps of 4 °C, info at 45 °C, alert at 55 °C
# -m root -M exec ...  deliver alerts through hdd-alert -> Alertmanager -> email
/dev/disk/by-id/ata-SAMSUNG_HD502HJ_S20BJ9EB300832 -a -o on -S on -s (S/../.././03|L/../../7/04) -W 4,45,55 -m root -M exec /usr/local/bin/hdd-smartd-alert

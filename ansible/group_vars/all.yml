homelab_base: /srv/pm_homelab
homelab_user: nymph

# Your Tailscale IPv4 (run: tailscale ip -4). When set, Caddy binds only to this
# interface so services are unreachable from the LAN. Leave empty to listen on all.
tailscale_ip: "100.117.222.10"

services:
  - name: immich
    compose_path: "{{ homelab_base }}/services/immich"
    manage_env: true
    port: 2283
    # Postgres bind-mount (DB_DATA_LOCATION); owned by the container's
    # postgres uid, not homelab_user. Never let the sync task chown it.
    sync_excludes:
      - postgres-data
  - name: navidrome
    compose_path: "{{ homelab_base }}/services/navidrome"
    manage_env: false
    port: 4533
  - name: glance
    compose_path: "{{ homelab_base }}/services/glance"
    manage_env: false
    port: 8080
    security_headers: false
  - name: adguard
    compose_path: "{{ homelab_base }}/services/adguard"
    manage_env: false
    port: 3080
    security_headers: false
  - name: sparky
    compose_path: "{{ homelab_base }}/services/sparky"
    manage_env: true
    port: 3004
    backend_port: 3010
    # Postgres bind-mount (DB_PATH); owned by the container's postgres uid,
    # not homelab_user. Never let the sync task chown it.
    sync_excludes:
      - postgresql

  # --- Sablier infra (no public vhost, called internally by Caddy) ---
  - name: sablier
    compose_path: "{{ homelab_base }}/services/sablier"
    manage_env: false
    port: 10000
    no_vhost: true

  # --- Always-on new services ---
  - name: syncthing
    compose_path: "{{ homelab_base }}/services/syncthing"
    manage_env: false
    port: 9007
  - name: cloudflared
    compose_path: "{{ homelab_base }}/services/cloudflared"
    manage_env: true
    port: 9099
    no_vhost: true
  - name: prometheus
    compose_path: "{{ homelab_base }}/services/prometheus"
    manage_env: false
    port: 9012
  - name: healthchecks
    compose_path: "{{ homelab_base }}/services/healthchecks"
    manage_env: true
    port: 9013
    # Postgres bind-mount (DB_DATA_LOCATION); owned by the container's
    # postgres uid, not homelab_user. Never let the sync task chown it.
    sync_excludes:
      - postgres-data
  - name: dayglance
    compose_path: "{{ homelab_base }}/services/dayglance"
    manage_env: false
    port: 9018
  - name: semaphore
    compose_path: "{{ homelab_base }}/services/semaphore"
    manage_env: true
    port: 9010

  # --- On-demand (Sablier-gated) new services ---
  - name: mealie
    compose_path: "{{ homelab_base }}/services/mealie"
    manage_env: true
    port: 9001
    sablier: true
    sablier_session_duration: 30m
  - name: dawarich
    compose_path: "{{ homelab_base }}/services/dawarich"
    manage_env: true
    port: 9002
    sablier: true
    sablier_session_duration: 15m
  - name: droppedneedle
    compose_path: "{{ homelab_base }}/services/droppedneedle"
    manage_env: true
    port: 9003
    sablier: true
    sablier_session_duration: 30m
  # onepanel (1Panel) deliberately excluded from ansible deploy: no official
  # docker-compose path exists (only a host-level installer script that wants
  # to manage the whole machine). See services/onepanel/README.md. Port 9005
  # reserved but unused until an operator decision is made.
  - name: homelable
    compose_path: "{{ homelab_base }}/services/homelable"
    manage_env: true
    port: 9006
    sablier: true
    sablier_session_duration: 15m
  - name: activepieces
    compose_path: "{{ homelab_base }}/services/activepieces"
    manage_env: true
    port: 9009
    sablier: true
    sablier_session_duration: 20m
  - name: woodpecker
    compose_path: "{{ homelab_base }}/services/woodpecker"
    manage_env: true
    port: 9011
    sablier: true
    sablier_session_duration: 20m
  - name: scrutiny
    compose_path: "{{ homelab_base }}/services/scrutiny"
    manage_env: false
    port: 9014
    sablier: true
    sablier_session_duration: 10m
  - name: glances
    compose_path: "{{ homelab_base }}/services/glances"
    manage_env: false
    port: 9015
    sablier: true
    sablier_session_duration: 10m
  - name: stirling-pdf
    compose_path: "{{ homelab_base }}/services/stirling-pdf"
    manage_env: false
    port: 9016
    sablier: true
    sablier_session_duration: 15m
  - name: atheos
    compose_path: "{{ homelab_base }}/services/atheos"
    manage_env: false
    port: 9017
    sablier: true
    sablier_session_duration: 30m
  - name: grampsweb
    compose_path: "{{ homelab_base }}/services/grampsweb"
    manage_env: true
    port: 9019
    sablier: true
    sablier_session_duration: 20m
  - name: plakar
    compose_path: "{{ homelab_base }}/services/plakar"
    manage_env: false
    port: 9021
    sablier: true
    sablier_session_duration: 10m
  - name: grafana
    compose_path: "{{ homelab_base }}/services/grafana"
    manage_env: true
    port: 9022
    sablier: true
    sablier_session_duration: 15m
  - name: splitpro
    compose_path: "{{ homelab_base }}/services/splitpro"
    manage_env: true
    port: 9023
    sablier: true
    sablier_session_duration: 15m
  - name: actual
    compose_path: "{{ homelab_base }}/services/actual"
    manage_env: false
    port: 9024
    sablier: true
    sablier_session_duration: 15m
  - name: ryot
    compose_path: "{{ homelab_base }}/services/ryot"
    manage_env: true
    port: 9025
    sablier: true
    sablier_session_duration: 20m
  - name: pipe-bomb
    compose_path: "{{ homelab_base }}/services/pipe-bomb"
    manage_env: false
    port: 9026
    sablier: true
    sablier_session_duration: 20m
  - name: lifeglance
    compose_path: "{{ homelab_base }}/services/lifeglance"
    manage_env: false
    port: 9027
    sablier: true
    sablier_session_duration: 20m
  - name: lastglance

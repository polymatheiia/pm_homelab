homelab_base: /srv/pm_homelab
homelab_user: nymph

# Your Tailscale IPv4 (run: tailscale ip -4). When set, Caddy binds only to this
# interface so services are unreachable from the LAN. Leave empty to listen on all.
tailscale_ip: "100.117.222.10"

services:
  - name: immich
    compose_path: "{{ homelab_base }}/services/immich"
    manage_env: true
    port: 2283
  - name: navidrome
    compose_path: "{{ homelab_base }}/services/navidrome"
    manage_env: false
    port: 4533
  - name: glance
    compose_path: "{{ homelab_base }}/services/glance"
    manage_env: false
    port: 8080
    security_headers: false
  - name: karakeep
    compose_path: "{{ homelab_base }}/services/karakeep"
    manage_env: true
    port: 3000
  - name: nextcloud
    compose_path: "{{ homelab_base }}/services/nextcloud"
    manage_env: true
    port: 8000
  - name: journiv
    compose_path: "{{ homelab_base }}/services/journiv"
    manage_env: true
    port: 8050
  - name: adguard
    compose_path: "{{ homelab_base }}/services/adguard"
    manage_env: false
    port: 3080
    security_headers: false
  - name: grocy
    compose_path: "{{ homelab_base }}/services/grocy"
    manage_env: false
    port: 9283
  - name: searxng
    compose_path: "{{ homelab_base }}/services/searxng"
    manage_env: false
    port: 8888
  - name: paperless
    compose_path: "{{ homelab_base }}/services/paperless"
    manage_env: true
    port: 8010
  - name: sparky
    compose_path: "{{ homelab_base }}/services/sparky"
    manage_env: true
    port: 3004
    backend_port: 3010
  - name: grafana
    compose_path: "{{ homelab_base }}/services/grafana"
    manage_env: true
    port: 3030
  - name: gramvault-atlas
    compose_path: "{{ homelab_base }}/services/gramvault-atlas"
    manage_env: true
    port: 8777

bridge_manager_bridges:
  - name: sh-telegram
    type: telegram
  - name: sh-meta
    type: meta

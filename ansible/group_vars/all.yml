  - name: gramvault-atlas
    compose_path: "{{ homelab_base }}/services/gramvault-atlas"
    manage_env: true
    port: 8777
    sablier: true
    sablier_session_duration: 20m
  - name: karakeep
    compose_path: "{{ homelab_base }}/services/karakeep"
    manage_env: true
    port: 3000
    sablier: true
    sablier_session_duration: 20m
  # FreedomBox deliberately excluded: no viable Docker deployment exists (the
  # official containerization project was archived 2019 — /etc/resolv.conf
  # locking, requires a reboot mid-install, LDAP breaks). FreedomBox is
  # designed to be the OS, not run inside one — same class of problem as
  # 1Panel above. Needs a dedicated VM/hardware if wanted later.
  # localsend deliberately excluded: it's a peer-to-peer LAN file-transfer
  # client (AirDrop-style) that runs on your own devices, not a headless
  # server — there's nothing here to deploy. (A self-hosted signaling
  # server or the static web frontend exist if that specific thing is
  # ever wanted, but that's not what the bookmark meant.)

bridge_manager_bridges:
  - name: sh-telegram
    type: telegram
  - name: sh-meta
    type: meta

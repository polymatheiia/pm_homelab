# roles/services/tasks/main.yml

- name: Ensure homelab base directory exists
  file:
    path: "{{ homelab_base }}"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0755"

- name: Ensure service directories exist
  file:
    path: "{{ item.compose_path }}"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0755"
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Sync service definition directory (compose + configs, excluding .env)
  # Requires rsync on controller + target (installed in docker role below)
  # sync_excludes (set per-service in group_vars) keeps bind-mounted DB data
  # dirs out of this entirely: compose_path and the controller's checkout are
  # the same path on disk, so without an exclude, --chown reassigns them from
  # the DB engine's uid to homelab_user on every run, corrupting Postgres's
  # data-dir ownership (see homelab_ansible_freeze_2026_09_15 postmortem).
  # become: no here deliberately overrides the play-level become: with a
  # remote (SSH) connection, synchronize otherwise re-execs rsync on the
  # target as root via a second, nested SSH+sudo hop that has no TTY and
  # can't use the play's become password, so it just fails outright. Since
  # homelab_user is the same account this connects as, running unprivileged
  # is sufficient and --chown is then a same-owner no-op.
  become: no
  synchronize:
    src: "{{ playbook_dir }}/../services/{{ item.name }}/"
    dest: "{{ item.compose_path }}/"
    delete: yes
    rsync_opts: "{{ ['--exclude=.env'] + (item.sync_excludes | default([]) | map('regex_replace', '^', '--exclude=') | list) + ['--chown=' + homelab_user + ':' + homelab_user] }}"
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check that .env exists for services that require it (on target)
  stat:
    path: "{{ item.compose_path }}/.env"
  register: env_stat
  when: item.manage_env | bool
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Fail if required .env is missing (create it from .env.example)
  fail:
    msg: >
      Missing services/{{ item.item.name }}/.env.
      Create it (for example by copying services/{{ item.item.name }}/.env.example to .env)
      at {{ item.item.compose_path }}/.env before running Ansible.
  when:
    - item.item.manage_env | bool
    - not item.stat.exists
  loop: "{{ env_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Check that .env exists on the controller
  stat:
    path: "{{ playbook_dir }}/../services/{{ item.name }}/.env"
  delegate_to: localhost
  become: no
  register: controller_env_stat
  when: item.manage_env | bool
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}"

# Only relevant when running from a machine that has its own copy of the
# secrets (e.g. the local/manual workflow, where controller and target are
# the same host). Runners with an ephemeral checkout (no committed .env,
# e.g. Semaphore) won't have a controller-side copy to push — that's fine,
# since the check above already confirms the target has its own.
- name: Copy .env file from controller if present
  copy:
    src: "{{ playbook_dir }}/../services/{{ item.item.name }}/.env"
    dest: "{{ item.item.compose_path }}/.env"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0600"
  when:
    - item.item.manage_env | bool
    - item.stat.exists
  loop: "{{ controller_env_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Remove stopped containers with dead network references
  shell: |
    for cid in $(docker ps -a --filter status=exited --filter status=created --filter status=dead --format '{% raw %}{{.ID}}{% endraw %}'); do
      nets=$(docker inspect "$cid" --format '{% raw %}{{range $k,$v := .NetworkSettings.Networks}}{{$v.NetworkID}} {{end}}{% endraw %}' 2>/dev/null)
      for netid in $nets; do
        if [ -n "$netid" ] && ! docker network inspect "$netid" > /dev/null 2>&1; then
          docker rm "$cid"
          break
        fi
      done
    done
  changed_when: false

- name: Deploy always-on services with docker compose v2
  # Set -e target_services='["name1","name2"]' to deploy only a subset
  # (for batched rollouts on memory-constrained hosts). Omit it to deploy all.
  community.docker.docker_compose_v2:
    project_src: "{{ item.compose_path }}"
    state: present
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (item.sablier | default(false) | bool)
    - target_services is not defined or item.name in target_services

- name: Deploy each Sablier-gated service, then stop it, one at a time
  # docker_compose_v2 has no "create without starting" state, so the only way
  # to get containers created (for Sablier to find by label) without running
  # them is present-then-stop. Doing that per-service via include_tasks keeps
  # peak load to one gated stack at a time, instead of bringing all of them
  # up together before stopping any.
  # Set -e target_services='["name1","name2"]' to deploy only a subset.
  include_tasks: deploy_gated_service.yml
  loop: "{{ services }}"
  loop_control:
    loop_var: gated_service
    label: "{{ gated_service.name }}"
  when:
    - gated_service.sablier | default(false) | bool
    - target_services is not defined or gated_service.name in target_services

- name: Find all .env files in service directories
  find:
    paths: "{{ homelab_base }}/services"
    patterns: ".env"
    recurse: yes
    depth: 1
  register: service_env_files

- name: Ensure all .env files are owned by homelab_user with mode 0600
  file:
    path: "{{ item.path }}"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0600"
  loop: "{{ service_env_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"


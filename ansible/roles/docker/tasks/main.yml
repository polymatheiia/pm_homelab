- name: Install Docker
  pacman:
    name:
      - docker
      - docker-compose
    state: present

- name: Enable Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Install Docker Compose plugin
  pacman:
    name: docker-compose
    state: present

- name: Install nvidia-container-toolkit
  pacman:
    name: nvidia-container-toolkit
    state: present

- name: Check if nvidia runtime is configured in daemon.json
  command: grep -q '"nvidia"' /etc/docker/daemon.json
  register: nvidia_runtime_check
  changed_when: false
  failed_when: false

- name: Configure nvidia runtime for Docker
  command: nvidia-ctk runtime configure --runtime=docker
  when: nvidia_runtime_check.rc != 0
  notify: Restart Docker

- name: Create Docker systemd override directory
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Make Docker wait for the Tailscale IP before starting containers
  # Containers that publish ports on {{ tailscale_ip }} (e.g. Sablier) come up
  # with NO host ports at all if dockerd starts before tailscale0 has its IP.
  # Capped at 60s and '-' prefixed so a broken Tailscale never blocks Docker.
  copy:
    content: |
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service

      [Service]
      ExecStartPre=-/usr/bin/tailscale wait --timeout=60s
    dest: /etc/systemd/system/docker.service.d/tailscale.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon

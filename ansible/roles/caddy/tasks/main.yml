- name: Install Caddy
  pacman:
    name: caddy
    state: present

- name: Check current custom Caddy build version marker
  stat:
    path: /usr/local/bin/caddy-sablier
  register: caddy_sablier_bin

- name: Set expected Caddy plugin list
  set_fact:
    caddy_plugins:
      - github.com/sablierapp/sablier-caddy-plugin@latest
      - github.com/caddy-dns/cloudflare@latest

- name: Compute expected Caddy plugin-set stamp
  # `creates:` below can only compare against a filename, so the stamp
  # encodes the exact --with plugin list; any future change to that list
  # (like adding caddy-dns/cloudflare did) produces a new stamp filename,
  # forcing a rebuild instead of silently reusing a stale binary that's
  # missing the new plugin.
  set_fact:
    caddy_build_stamp: "{{ (caddy_plugins | join(',')) | hash('sha1') }}"

- name: Build custom Caddy with Sablier + Cloudflare DNS plugins (via caddy:builder image)
  # Cloudflare DNS plugin enables DNS-01 ACME challenges, so Caddy can get
  # real Let's Encrypt certs for public domains (e.g. tunneled through
  # Cloudflare Tunnel) without needing port 80/443 reachable from the
  # internet directly.
  command: >
    docker run --rm -v {{ homelab_base }}/build:/out caddy:builder
    xcaddy build
    --with github.com/sablierapp/sablier-caddy-plugin@latest
    --with github.com/caddy-dns/cloudflare@latest
    --output /out/caddy-sablier
  args:
    creates: "{{ homelab_base }}/build/caddy-sablier.{{ caddy_build_stamp }}.stamp"

- name: Record Caddy plugin-set stamp for this build
  file:
    path: "{{ homelab_base }}/build/caddy-sablier.{{ caddy_build_stamp }}.stamp"
    state: touch

- name: Install custom Caddy-Sablier binary
  copy:
    src: "{{ homelab_base }}/build/caddy-sablier"
    dest: /usr/local/bin/caddy-sablier
    remote_src: yes
    owner: root
    group: root
    mode: '0755'
  notify: Restart Caddy

- name: Deploy Cloudflare API token env file (DNS-01 ACME for public domains)
  copy:
    content: "CLOUDFLARE_API_TOKEN={{ cloudflare_api_token }}\n"
    dest: /etc/caddy/cloudflare_token.env
    owner: root
    group: root
    mode: '0600'
  when: cloudflare_api_token is defined
  notify: Restart Caddy

- name: Deploy Caddy systemd override to use the custom Sablier-enabled binary
  copy:
    content: |
      [Service]
      EnvironmentFile=-/etc/caddy/cloudflare_token.env
      ExecStartPre=
      ExecStartPre=/usr/local/bin/caddy-sablier validate --config /etc/caddy/Caddyfile
      ExecStart=
      ExecStart=/usr/local/bin/caddy-sablier run --config /etc/caddy/Caddyfile
      ExecReload=
      ExecReload=/usr/local/bin/caddy-sablier reload --config /etc/caddy/Caddyfile --force
    dest: /etc/systemd/system/caddy.service.d/20-sablier-binary.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart Caddy

- name: Create Caddy config directory
  file:
    path: /etc/caddy
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  notify: Restart Caddy

- name: Create Caddy systemd override directory
  file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Caddy systemd override for Tailscale dependency
  copy:
    content: |
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service

      [Service]
      Restart=on-failure
      RestartSec=5s
    dest: /etc/systemd/system/caddy.service.d/tailscale.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart Caddy

- name: Enable Caddy
  systemd:
    name: caddy
    enabled: yes
    state: started

services:
  backend:
    image: ghcr.io/pouzor/homelable-backend:latest
    container_name: homelable_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/homelab.db
      CORS_ORIGINS: '["https://homelable.lab"]'
    volumes:
      - backend_data:/app/data
    networks: [homelable-internal]
    # nmap/ping/traceroute need raw sockets to scan the LAN.
    cap_add:
      - NET_RAW
    labels:
      - "sablier.enable=true"
      - "sablier.group=homelable"

  frontend:
    image: ghcr.io/pouzor/homelable-frontend:latest
    container_name: homelable_frontend
    restart: unless-stopped
    ports:
      - "9006:80"
    depends_on:
      - backend
    networks: [homelable-internal]
    labels:
      - "sablier.enable=true"
      - "sablier.group=homelable"

  mcp:
    image: ghcr.io/pouzor/homelable-mcp:latest
    container_name: homelable_mcp
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks: [homelable-internal]
    labels:
      - "sablier.enable=true"
      - "sablier.group=homelable"

volumes:
  backend_data: {}

networks:
  homelable-internal: {}

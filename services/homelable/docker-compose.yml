services:
  backend:
    image: ghcr.io/pouzor/homelable-backend:latest
    container_name: homelable_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/homelab.db
      CORS_ORIGINS: '["https://homelable.lab"]'
    volumes:
      - backend_data:/app/data
    networks: [homelable-internal]
    # nmap/ping/traceroute need raw sockets to scan the LAN.
    cap_add:
      - NET_RAW
    healthcheck:
      # No unauthenticated /health route; FastAPI's /docs page needs no auth
      # and reliably returns 200.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/docs"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s
    labels:
      - "sablier.enable=true"
      - "sablier.group=homelable"

  frontend:
    image: ghcr.io/pouzor/homelable-frontend:latest
    container_name: homelable_frontend
    restart: unless-stopped
    ports:
      - "9006:80"
    depends_on:
      - backend
    networks: [homelable-internal]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:80/"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s
    labels:
      - "sablier.enable=true"
      - "sablier.group=homelable"

  mcp:
    image: ghcr.io/pouzor/homelable-mcp:latest
    container_name: homelable_mcp
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks: [homelable-internal]
    healthcheck:
      # No curl/wget in this image; python3 is available.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s
    labels:
      - "sablier.enable=true"
      - "sablier.group=homelable"

volumes:
  backend_data: {}

networks:
  homelable-internal: {}

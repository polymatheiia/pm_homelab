# GLANCEvault: https://github.com/glance-apps/glance-vault
# Optional self-hosted sync backend for the GLANCE family (dayGLANCE,
# lastGLANCE, lifeGLANCE) — zero-knowledge sync, cross-device intents, and
# media storage. All three apps point at this one instance; it namespaces
# each app's rows with an "app" column, so one server backs the whole suite.
services:
  glancevault:
    image: ghcr.io/glance-apps/glance-vault:latest
    container_name: glancevault
    restart: unless-stopped
    env_file: [.env]
    environment:
      GLANCEVAULT_PORT: "8080"
      GLANCEVAULT_STORAGE_PATH: /data/glancevault.db
    ports:
      # Loopback only — reached through Caddy, never directly.
      - "127.0.0.1:9029:8080"
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - "glance.name=GLANCEvault"
      - "glance.url=https://glancevault.lab"
      - "glance.category=core"

volumes:
  data:

services:
  actual:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual
    restart: unless-stopped
    ports:
      - "9024:5006"
    volumes:
      - actual-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5006/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s
    labels:
      - "sablier.enable=true"
      - "sablier.group=actual"
      - "glance.name=Actual Budget"
      - "glance.icon=si:actualbudget"
      - "glance.url=https://actual.lab"
      - "glance.category=on-demand"

volumes:
  actual-data:

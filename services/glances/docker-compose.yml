services:
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    ports:
      - "9015:61208"
    environment:
      - GLANCES_OPT=-w
      - TZ=UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:61208/api/4/status"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s
    labels:
      - "sablier.enable=true"
      - "sablier.group=glances"
      - "glance.name=Glances"
      - "glance.url=https://glances.lab"
      - "glance.category=on-demand"

services:
  atheos:
    image: hlsiira/atheos:latest
    container_name: atheos
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "9017:80"
    volumes:
      - data:/var/www/html
      - apache_conf:/etc/apache2
    healthcheck:
      # Image has bash + php but no curl/wget; raw TCP connect is the
      # portable check here.
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/80'"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s
    labels:
      - "sablier.enable=true"
      - "sablier.group=atheos"
      - "glance.name=Atheos"
      - "glance.url=https://atheos.lab"
      - "glance.category=on-demand"

volumes:
  data: {}
  apache_conf: {}

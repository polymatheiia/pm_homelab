services:
  droppedneedle:
    image: droppedneedle/droppedneedle:latest
    container_name: droppedneedle
    restart: unless-stopped
    env_file: [.env]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-027}
      PORT: 8688
      TZ: ${TZ}
      SLSKD_DOWNLOADS_PATH: /data/slskd/complete
    ports:
      - "9003:8688"
    volumes:
      - config:/app/config
      - cache:/app/cache
      - plugins:/app/plugins
      # Common parent for the existing music library (${MEDIA_LOCATION}/music, shared
      # read-only with navidrome) and completed downloads, so imports move atomically.
      - ${MEDIA_LOCATION}:/data:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8688/health"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3
    labels:
      - "sablier.enable=true"
      - "sablier.group=droppedneedle"

volumes:
  config:
  cache:
  plugins:

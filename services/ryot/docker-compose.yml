services:
  ryot-db:
    image: postgres:16-alpine
    container_name: ryot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ryot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ryot
    volumes:
      - ryot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryot"]
      interval: 10s
      retries: 10

  ryot:
    image: ghcr.io/ignisda/ryot:latest
    container_name: ryot
    restart: unless-stopped
    depends_on:
      ryot-db:
        condition: service_healthy
    ports:
      - "9025:8000"
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://ryot:${POSTGRES_PASSWORD}@ryot-db:5432/ryot
      FRONTEND_URL: https://ryot.lab
    volumes:
      - ryot-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s
    labels:
      - "sablier.enable=true"
      - "sablier.group=ryot"
      - "glance.name=Ryot"
      - "glance.url=https://ryot.lab"
      - "glance.category=on-demand"

volumes:
  ryot-db-data:
  ryot-data:

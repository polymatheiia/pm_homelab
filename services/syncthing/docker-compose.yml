services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    hostname: syncthing
    labels:
      - "glance.name=Syncthing"
      - "glance.icon=si:syncthing"
      - "glance.url=https://syncthing.lab"
      - "glance.category=core"
    ports:
      - "9007:8384"       # Web GUI
      - "22000:22000/tcp" # sync protocol (TCP)
      - "22000:22000/udp" # sync protocol (QUIC)
      - "21027:21027/udp" # local discovery broadcast
    volumes:
      # Single home dir: holds config, index DB, and default sync folders.
      # Add extra bind mounts here if you want specific sync folders on the host.
      - data:/var/syncthing
      - /srv/pm_vault:/data/pm_vault
      - /srv/pm_files:/data/files

volumes:
  data:

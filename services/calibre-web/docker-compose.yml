services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    # Not behind Sablier: a cold start takes ~20s, and KOReader gives up on an
    # OPDS request after 10s and can't parse Sablier's HTML waiting page.
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:9008:8083"
    volumes:
      # New volume: the old "config" volume holds Calibre-Web Automated state.
      - appdata:/config
      # Read-only on purpose: quemachine owns this copy (see bookstore-sync).
      - /srv/pm_files/Books/Bookstore:/books:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8083/"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s
    labels:
      - "glance.name=Calibre-Web"
      - "glance.icon=si:librarything"
      - "glance.url=https://calibre-web.lab"
      - "glance.category=core"

volumes:
  appdata:

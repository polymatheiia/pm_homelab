services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    env_file:
      - .env
    # Token comes from TUNNEL_TOKEN in .env; kept off the command line, where any local user could read it via ps.
    command: tunnel --no-autoupdate run
    # No ports mapped: this is an outbound-only tunnel to Cloudflare's edge.

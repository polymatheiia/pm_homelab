services:
  meilisearch:
    image: getmeili/meilisearch:v1.56.1
    container_name: karakeep_meilisearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_UPGRADE_DB: "true"
    volumes:
      # Copy of the v1.13 "meilisearch" volume, upgraded in place; the old one is kept for rollback.
      - meilisearch-v1_56:/meili_data
    networks:
      - karakeep-internal
    labels:
      - "sablier.enable=true"
      - "sablier.group=karakeep"

  chrome:
    # Upstream's own image; the entrypoint sets headless + DevTools on :9222.
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: karakeep_chrome
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    networks:
      - karakeep-internal
    labels:
      - "sablier.enable=true"
      - "sablier.group=karakeep"

  web:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    container_name: karakeep_web
    restart: unless-stopped
    labels:
      - "sablier.enable=true"
      - "sablier.group=karakeep"
      - "glance.name=Karakeep"
      - "glance.url=https://karakeep.lab"
      - "glance.category=on-demand"
    ports:
      - "127.0.0.1:3000:3000"
      - "100.117.222.10:3000:3000"
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data # DON'T CHANGE THIS
    volumes:
      - data:/data
    depends_on:
      - meilisearch
      - chrome
    networks:
      - karakeep-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # s6-overlay init (in the image since late 2026) chowns /run and drops to the app user.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

volumes:
  meilisearch-v1_56:
    name: karakeep_meilisearch-v1_56
  data:

networks:
  karakeep-internal: {}

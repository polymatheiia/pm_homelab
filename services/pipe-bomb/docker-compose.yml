services:
  pipe-bomb:
    image: ghcr.io/pipe-bomb/pipe-bomb:latest
    container_name: pipe-bomb
    restart: unless-stopped
    ports:
      - "9026:9193"
    environment:
      PUBLIC_URL: https://pipe-bomb.lab
    volumes:
      - pipe-bomb-data:/data
      - pipe-bomb-music:/music:ro
    labels:
      - "sablier.enable=true"
      - "sablier.group=pipe-bomb"
      - "glance.name=Pipe Bomb"
      - "glance.url=https://pipe-bomb.lab"
      - "glance.category=on-demand"

volumes:
  pipe-bomb-data:
  pipe-bomb-music:
